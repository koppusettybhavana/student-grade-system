<!DOCTYPE html>
<html>
<head>
    <title>Student Grade Management</title>
</head>
<body>

<h2>Add Student</h2>

<form action="/add" method="post">
    Name: <input type="text" name="name" required><br><br>
    Subject: <input type="text" name="subject" required><br><br>
    Marks: <input type="number" name="marks" required><br><br>
    Grade: <input type="text" name="grade" required><br><br>
    <button type="submit">Add Student</button>
</form>

<hr>

<h2>Student List</h2>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Subject</th>
        <th>Marks</th>
        <th>Grade</th>
    </tr>

    {% for s in students %}
    <tr>
        <td>{{ s[0] }}</td>
        <td>{{ s[1] }}</td>
        <td>{{ s[2] }}</td>
        <td>{{ s[3] }}</td>
        <td>{{ s[4] }}</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
